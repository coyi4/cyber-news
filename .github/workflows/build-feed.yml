name: Build news feed

on:
  schedule:
    # Main schedule is cron-job.org, which triggers this every 15 min via workflow_dispatch.
    # This hourly run at an off-peak minute is the backup if cron-job.org misses.
    - cron: "17 * * * *"
  workflow_dispatch:          # "Run workflow" button for a manual refresh
  push:
    paths: [feeds.yaml, build_feed.py, docs/index.html]

# Publishes straight to GitHub Pages instead of committing results to the repo.
# Each run reads the previous feed back from the live site, so it remembers what it has seen.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: build-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build feed
        run: python build_feed.py
        env:
          FEED_STATE_URL: https://coyi4.github.io/cyber-news/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v5
