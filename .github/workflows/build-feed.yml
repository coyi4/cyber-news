name: Build news feed

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 min (GitHub may run a few minutes late)
  workflow_dispatch:          # "Run workflow" button for a manual refresh
  push:
    paths: [feeds.yaml, build_feed.py]

permissions:
  contents: write

concurrency:
  group: build-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python build_feed.py
      - name: Commit updated feed
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add docs .state
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update feed"
            git pull --rebase
            git push
          fi
