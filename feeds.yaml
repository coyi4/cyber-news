# Cyber bundle, migrated from RSS.app (83 feeds).
#
# Each source takes optional:
#   tags                - labels for filtering in the reader (tickers here, so news and filings group together)
#   include             - keep only items whose headline/summary mentions one of these
#   exclude             - drop items mentioning any of these
#   exclude_domains     - drop items from these sites
#   exclude_publishers  - drop items from these outlet names
#   strip_title         - regex patterns to remove from headlines
#   disabled: true      - pause a source without deleting it

settings:
  title: Cyber
  site_url: https://YOUR-GITHUB-USERNAME.github.io/YOUR-REPO/
  max_age_days: 5           # RSS.app bundle showed the last 5 days
  max_items: 2500
  # Each Google News search only looks back this far (the feed keeps older items from
  # earlier runs). Set `when` on a single search to override, e.g. 1d for very busy names.
  google_news_when: 2d
  # SEC EDGAR blocks requests without a contact in the user agent, so put your email here.
  user_agent: "Personal news aggregator bmsacct4@gmail.com"

  # From the RSS.app bundle blacklist (title/description keywords)
  global_exclude:
    - class action

  # From the RSS.app bundle blacklist (sites). A domain also blocks its subdomains,
  # so investing.com covers uk.investing.com, and yahoo.com covers finance.yahoo.com.
  # Adding a site here also removes its already-saved items on the next run.
  # docs/status.json lists the sites filling your feed, most first.
  exclude_domains:
    - tikr.com
    - jerseydigs.com
    - msn.com
    - finance.yahoo.com
    - stockstory.org
    - stocktitan.net
    - tradingview.com
    - barchart.com
    - letsdatascience.com
    - simplywall.st
    - investing.com
    - chartmill.com
    - theglobeandmail.com
    - fool.com
    - coincentral.com
    - aol.com
    - marketscreener.com
    - 247wallst.com
    - morningstar.com
    - yahoo.com
    - gurufocus.com
    - reviewjournal.com
    - benzinga.com
    - forbes.com
    - macombdaily.com
    - marketbeat.com
    - trefis.com
    - en.globes.co.il
  exclude_publishers: []

sources:
  # ---- Industry news and IR pages ------------------------------------------
  - name: The Hacker News
    type: rss
    url: https://feeds.feedburner.com/TheHackersNews
    tags: [Industry]

  - name: CTech
    type: scrape                    # no feed; reads headline links off the page
    url: https://www.calcalistech.com/ctechnews
    item: 'a[href*="/ctechnews/article/"]'
    strip_title: ['^\d{1,2}:\d{2}\s+']    # drop the "10:45" timestamps CTech puts before headlines
    tags: [Industry]

  - name: Sun Corp IR
    type: rss                       # the IR page loads from this disclosure feed
    url: https://www.xj-storage.jp/public-list/GetList2.aspx?company=AS02371&len=40&doctype=15,20001,15013,20000,20091,20096,20098,20109,20200,34100&output=rss
    tags: [Sun Corp]

  # ---- Google News searches ------------------------------------------------
  # Multi-word names are in quotes so all the words appear together, and names that
  # are also everyday words get context or exclusions. Single distinctive names stay
  # unquoted: quoting those made Google return fewer real results in testing.
  # Search operators: "exact phrase", OR, -word, site:, when:2d

